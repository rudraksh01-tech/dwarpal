name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (with Postgres + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: dwarpal
          POSTGRES_PASSWORD: dwarpal
          POSTGRES_DB: dwarpal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dwarpal" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Tests never call Groq or Gemini, so no keys are needed
      - run: pytest -v
        env:
          DWARPAL_TEST_DATABASE_URL: postgresql://dwarpal:dwarpal@localhost:5432/dwarpal

  frontend:
    name: Playground build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  kubernetes:
    name: Docker image + Helm on a kind cluster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t dwarpal:ci .

      - name: Smoke-test the container
        run: |
          docker run -d --name api -p 8000:8000 dwarpal:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 1; done
          curl -fs localhost:8000/api/health | grep -q '"status":"ok"'
          curl -fs localhost:8000/api/scenarios | grep -q rug_pull_hinglish
          docker images dwarpal:ci --format 'Image size: {{.Size}}'

      - uses: azure/setup-helm@v4

      - name: Lint the chart
        run: helm lint deploy/helm/dwarpal

      - uses: helm/kind-action@v1
        with:
          cluster_name: dwarpal

      - name: Install the chart (gateway + Postgres/pgvector + Redis)
        run: |
          kind load docker-image dwarpal:ci --name dwarpal
          helm install demo deploy/helm/dwarpal --set image.tag=ci --wait --timeout 5m
          kubectl get pods -o wide

      - name: helm test (API reports Postgres and Redis in use)
        run: helm test demo --logs

      - if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods
          kubectl logs -l app.kubernetes.io/component=api --tail=100
