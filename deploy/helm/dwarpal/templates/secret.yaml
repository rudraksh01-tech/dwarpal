{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dwarpal.secretName" . }}
  labels: {{- include "dwarpal.labels" . | nindent 4 }}
type: Opaque
stringData:
  GROQ_API_KEY: {{ .Values.keys.groqApiKey | quote }}
  GEMINI_API_KEY: {{ .Values.keys.geminiApiKey | quote }}
  DATABASE_URL: {{ include "dwarpal.databaseUrl" . | quote }}
{{- end }}
